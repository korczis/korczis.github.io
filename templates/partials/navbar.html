{#- Flowbite Pro application shell: navbar (admin dashboard 1.1.1, section 3). The drawer toggle
    opens #sidebar below lg; the search submits to the catalogue, which filters by ?q=. -#}
<nav class="fixed z-30 w-full border-b border-gray-200 bg-white dark:border-gray-700 dark:bg-gray-800" aria-label="Main">
  <div class="px-3 py-3 lg:px-5 lg:pl-3">
    <div class="flex items-center justify-between">
      <div class="flex items-center justify-start">
        <button id="toggleSidebarMobile" type="button" data-drawer-target="sidebar" data-drawer-toggle="sidebar" aria-controls="sidebar" aria-expanded="false"
          class="mr-2 cursor-pointer rounded p-2 text-gray-600 hover:bg-gray-100 hover:text-gray-900 focus:bg-gray-100 focus:ring-2 focus:ring-gray-100 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white dark:focus:bg-gray-700 dark:focus:ring-gray-700 lg:hidden">
          <span class="sr-only">Open navigation</span>{{ <icon name="menu" class="h-6 w-6" /> }}
        </button>
        <a href="{{ config.base_url }}/" aria-label="Tomas Korcak, overview" class="mr-4 flex items-center gap-3 lg:mr-14">
          <img src="{{ get_url(path='favicon.svg') }}" class="h-8 w-8" width="32" height="32" alt="">
          <span class="hidden self-center whitespace-nowrap text-xl font-semibold text-gray-900 dark:text-white sm:inline">Tomas Korcak</span>
        </a>
        <form action="{{ config.base_url }}/projects/" method="get" role="search" class="hidden lg:block lg:pl-2">
          <label for="topbar-search" class="sr-only">Search projects</label>
          <div class="relative mt-1 lg:w-96">
            <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3 text-gray-500 dark:text-gray-400">{{ <icon name="search" class="h-5 w-5" /> }}</div>
            <input type="search" name="q" id="topbar-search" placeholder="Search projects, words or technology"
              class="block w-full rounded-lg border border-gray-300 bg-gray-50 p-2.5 pl-10 text-gray-900 focus:border-primary-500 focus:ring-primary-500 dark:border-gray-600 dark:bg-gray-700 dark:text-white dark:placeholder-gray-400 dark:focus:border-primary-500 dark:focus:ring-primary-500 sm:text-sm">
          </div>
        </form>
      </div>
      <div class="flex items-center gap-1">
        <button id="theme-toggle" type="button" data-js data-tooltip-target="tooltip-theme" class="rounded-lg p-2.5 text-sm text-gray-600 hover:bg-gray-100 focus:outline-none focus:ring-4 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:focus:ring-gray-700">
          <span class="sr-only">Toggle dark mode</span>
          {{ <icon name="moon" class="h-5 w-5 dark:hidden" /> }}
          {{ <icon name="sun" class="hidden h-5 w-5 dark:block" /> }}
        </button>
        <div id="tooltip-theme" role="tooltip" class="tooltip invisible absolute z-10 inline-block rounded-lg bg-gray-900 px-3 py-2 text-sm font-medium text-white opacity-0 shadow-sm transition-opacity duration-300 dark:bg-gray-700">Toggle dark mode<div class="tooltip-arrow" data-popper-arrow></div></div>
        <a href="https://github.com/{{ config.extra.github }}" data-tooltip-target="tooltip-github" class="rounded-lg p-2.5 text-gray-600 hover:bg-gray-100 hover:text-gray-900 focus:outline-none focus:ring-4 focus:ring-gray-200 dark:text-gray-400 dark:hover:bg-gray-700 dark:hover:text-white dark:focus:ring-gray-700">
          <span class="sr-only">GitHub profile</span>{{ <icon name="github" class="h-5 w-5" /> }}
        </a>
        <div id="tooltip-github" role="tooltip" class="tooltip invisible absolute z-10 inline-block rounded-lg bg-gray-900 px-3 py-2 text-sm font-medium text-white opacity-0 shadow-sm transition-opacity duration-300 dark:bg-gray-700">github.com/{{ config.extra.github }}<div class="tooltip-arrow" data-popper-arrow></div></div>
        <a href="{{ config.extra.majordomus_url }}" class="ml-2 hidden items-center rounded-lg bg-primary-700 px-3 py-2 text-sm font-medium text-white hover:bg-primary-800 focus:outline-none focus:ring-4 focus:ring-primary-300 dark:bg-primary-600 dark:hover:bg-primary-700 dark:focus:ring-primary-800 sm:inline-flex">
          {{ <icon name="shield" class="mr-2 h-4 w-4" /> }}Majordomus
        </a>
      </div>
    </div>
  </div>
</nav>
