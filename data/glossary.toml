id = "risk-assessment"
term = "Risk assessment"
term_cs = "Hodnocení rizik"
kind = "concept"
categories = ["security"]
definition = "Identifying risks, estimating how likely and how severe each is, and ranking them so the work starts with what matters most."
definition_cs = "Určení rizik, odhad jejich pravděpodobnosti a závažnosti a jejich seřazení, aby práce začala tím nejdůležitějším."
reference = { title = "ISO 31000: risk management", url = "https://www.iso.org/iso-31000-risk-management.html" }

[[terms]]
id = "market-intelligence"
term = "Market intelligence"
term_cs = "Tržní zpravodajství"
kind = "concept"
categories = ["security"]
definition = "Knowledge about a market (prices, comparables, competitors and demand) gathered from public and licensed sources to support a decision."
definition_cs = "Poznatky o trhu (ceny, srovnatelné případy, konkurence a poptávka) sebrané z veřejných a licencovaných zdrojů jako podklad pro rozhodnutí."
reference = { title = "Market intelligence (Wikipedia)", url = "https://en.wikipedia.org/wiki/Market_intelligence" }

[[terms]]
id = "decision-support-system"
term = "Decision support system"
term_cs = "Systém pro podporu rozhodování"
kind = "concept"
categories = ["security"]
definition = "Software that gathers data and analysis into reports and views that help people make a decision, rather than making it for them."
definition_cs = "Software, který shromáždí data a analýzy do zpráv a pohledů, jež lidem pomáhají rozhodnout, místo aby rozhodoval za ně."
reference = { title = "Decision support system (Wikipedia)", url = "https://en.wikipedia.org/wiki/Decision_support_system" }

[[terms]]
id = "insolvency"
term = "Insolvency"
term_cs = "Insolvence"
kind = "concept"
categories = ["security"]
definition = "The state of a debtor who cannot pay their debts; insolvency proceedings and the creditors' claims in them are recorded in public registers."
definition_cs = "Stav dlužníka, který nedokáže splácet své dluhy; insolvenční řízení a přihlášky věřitelů v nich se zapisují do veřejných rejstříků."
reference = { title = "Insolvency (Wikipedia)", url = "https://en.wikipedia.org/wiki/Insolvency" }

[[terms]]
id = "record-linkage"
term = "Entity resolution"
term_cs = "Ztotožnění subjektů"
aliases = ["record linkage"]
kind = "concept"
categories = ["security"]
definition = "Finding the records, across sources, that refer to the same company or person, by shared identifiers first and by similar names and addresses second."
definition_cs = "Hledání záznamů napříč zdroji, které se týkají téže firmy nebo osoby, nejdřív podle společných identifikátorů, pak podle podobných jmen a adres."
reference = { title = "Record linkage (Wikipedia)", url = "https://en.wikipedia.org/wiki/Record_linkage" }

[[terms]]
id = "knowledge-graph"
term = "Knowledge graph"
term_cs = "Znalostní graf"
kind = "concept"
categories = ["security"]
definition = "Knowledge stored as entities and the relations between them, so a question can follow links (who owns what, who sits where) instead of joining tables."
definition_cs = "Znalosti uložené jako subjekty a vztahy mezi nimi, takže dotaz může sledovat vazby (kdo co vlastní, kdo kde sedí) místo spojování tabulek."
reference = { title = "Knowledge graph (Wikipedia)", url = "https://en.wikipedia.org/wiki/Knowledge_graph" }

[[terms]]
id = "data-integration"
term = "Data integration"
term_cs = "Integrace dat"
kind = "concept"
categories = ["security"]
definition = "Combining data from many sources (registers, APIs, files) into one consistent view, with each record keeping where it came from."
definition_cs = "Spojení dat z mnoha zdrojů (rejstříků, API, souborů) do jednoho jednotného pohledu, kde si každý záznam pamatuje, odkud pochází."
reference = { title = "Data integration (Wikipedia)", url = "https://en.wikipedia.org/wiki/Data_integration" }

[[terms]]
id = "audit-trail"
term = "Audit trail"
term_cs = "Auditní stopa"
kind = "concept"
categories = ["security"]
definition = "A chronological record of who did what and on which evidence, kept so that the work can be checked and retraced later."
definition_cs = "Chronologický záznam o tom, kdo co udělal a na základě jakých podkladů, uchovaný proto, aby šlo práci později ověřit a zrekonstruovat."
reference = { title = "Audit trail (Wikipedia)", url = "https://en.wikipedia.org/wiki/Audit_trail" }

[[terms]]
id = "information-extraction"
term = "Information extraction"
term_cs = "Vytěžování informací"
kind = "concept"
categories = ["security"]
definition = "Turning documents (scans, PDFs, free text) into structured fields such as names, dates and amounts, with OCR and language or vision models."
definition_cs = "Převod dokumentů (skenů, PDF, volného textu) na strukturovaná pole, jako jsou jména, data a částky, pomocí OCR a jazykových nebo obrazových modelů."
reference = { title = "Information extraction (Wikipedia)", url = "https://en.wikipedia.org/wiki/Information_extraction" }

[[terms]]
id = "orchestration"
term = "Orchestration"
term_cs = "Orchestrace"
kind = "concept"
categories = ["security"]
definition = "Coordinating many automated steps, services or agents (queues, workflows, schedules) so they run in the right order and recover when one fails."
definition_cs = "Koordinace mnoha automatických kroků, služeb nebo agentů (fronty, workflow, plány), aby běžely ve správném pořadí a zotavily se, když jeden selže."
reference = { title = "Orchestration in computing (Wikipedia)", url = "https://en.wikipedia.org/wiki/Orchestration_(computing)" }

# Languages and technologies the measured data names (data/index.json, data/recent.json,
# data/projects.toml, data/experience.json): check-glossary refuses a name without a term.

[[terms]]
id = "makefile"
term = "Makefile"
kind = "language"
aliases = ["Make", "make"]
definition = "The build language of make: targets, the files they depend on and the commands that rebuild them when a dependency changes."
definition_cs = "Jazyk nástroje make: cíle, soubory, na kterých závisí, a příkazy, které je přestaví, když se závislost změní."
reference = { title = "GNU make manual", url = "https://www.gnu.org/software/make/manual/make.html" }

[[terms]]
id = "cmake"
term = "CMake"
kind = "language"
definition = "A build-system generator for C and C++: one description of a project produces Makefiles, Ninja files or IDE projects on any platform."
definition_cs = "Generátor buildovacích systémů pro C a C++: jeden popis projektu vytvoří Makefile, soubory Ninja nebo projekty IDE na libovolné platformě."
reference = { title = "CMake documentation", url = "https://cmake.org/cmake/help/latest/" }

[[terms]]
id = "just"
term = "Just"
kind = "language"
aliases = ["justfile"]
definition = "A command runner: named recipes in a justfile, like make without the build semantics; the entry point of most of these repositories."
definition_cs = "Spouštěč příkazů: pojmenované recepty v souboru justfile, jako make bez buildovací logiky; vstupní bod většiny těchto repozitářů."
reference = { title = "just manual", url = "https://just.systems/man/en/" }

[[terms]]
id = "apacheconf"
term = "ApacheConf"
kind = "language"
aliases = ["Apache"]
definition = "The configuration language of the Apache HTTP Server: virtual hosts, rewrite rules and access control."
definition_cs = "Konfigurační jazyk webového serveru Apache HTTP: virtuální hosty, přepisovací pravidla a řízení přístupu."
reference = { title = "Apache HTTP Server documentation", url = "https://httpd.apache.org/docs/current/" }

[[terms]]
id = "openscad"
term = "OpenSCAD"
kind = "language"
definition = "A language for solid 3D models described as code: shapes combined by union, difference and transformation, ready for 3D printing."
definition_cs = "Jazyk pro pevné 3D modely popsané kódem: tvary skládané sjednocením, rozdílem a transformacemi, připravené pro 3D tisk."
reference = { title = "OpenSCAD documentation", url = "https://openscad.org/documentation.html" }

[[terms]]
id = "r"
term = "R"
title = "R (programming language)"
title_cs = "R (programovací jazyk)"
kind = "language"
definition = "A language and environment for statistics and data analysis, with plotting and a large library of statistical methods."
definition_cs = "Jazyk a prostředí pro statistiku a analýzu dat, s grafy a rozsáhlou knihovnou statistických metod."
reference = { title = "The R Project", url = "https://www.r-project.org/about.html" }

[[terms]]
id = "tex"
term = "TeX"
kind = "language"
aliases = ["LaTeX"]
definition = "A typesetting language for documents and mathematics; LaTeX is the macro package most documents are written in."
definition_cs = "Sázecí jazyk pro dokumenty a matematiku; LaTeX je balík maker, ve kterém je napsaná většina dokumentů."
reference = { title = "LaTeX project", url = "https://www.latex-project.org/about/" }

[[terms]]
id = "xslt"
term = "XSLT"
kind = "language"
definition = "A language that transforms XML documents into other XML, HTML or text by templates matched against the input tree."
definition_cs = "Jazyk, který převádí dokumenty XML na jiné XML, HTML nebo text pomocí šablon párovaných se vstupním stromem."
reference = { title = "W3C XSLT 3.0", url = "https://www.w3.org/TR/xslt-30/" }

[[terms]]
id = "squirrel"
term = "Squirrel"
kind = "language"
definition = "A small embeddable scripting language; OpenTTD runs its AI players and game scripts in it."
definition_cs = "Malý vložitelný skriptovací jazyk; OpenTTD v něm spouští své AI hráče a herní skripty."
reference = { title = "Squirrel on GitHub", url = "https://github.com/albertodemichelis/squirrel" }

[[terms]]
id = "plpgsql"
term = "PL/pgSQL"
kind = "language"
aliases = ["PLpgSQL"]
definition = "PostgreSQL's procedural language: functions and triggers that run SQL with variables, loops and conditions inside the database."
definition_cs = "Procedurální jazyk PostgreSQL: funkce a triggery, které uvnitř databáze spouštějí SQL s proměnnými, cykly a podmínkami."
reference = { title = "PostgreSQL: PL/pgSQL", url = "https://www.postgresql.org/docs/current/plpgsql.html" }

[[terms]]
id = "eex"
term = "EEx and HEEx"
kind = "language"
aliases = ["HTML+EEX", "EEx", "HEEx"]
definition = "Elixir's embedded templates: EEx puts Elixir in text, HEEx in HTML that Phoenix LiveView checks and renders."
definition_cs = "Vložené šablony Elixiru: EEx vkládá Elixir do textu, HEEx do HTML, které Phoenix LiveView kontroluje a vykresluje."
reference = { title = "Phoenix.Component and HEEx", url = "https://hexdocs.pm/phoenix_live_view/Phoenix.Component.html" }

[[terms]]
id = "mermaid"
term = "Mermaid"
kind = "language"
definition = "A text language for diagrams (flowcharts, sequences, state machines) rendered from Markdown-like source."
definition_cs = "Textový jazyk pro diagramy (vývojové diagramy, sekvence, stavové automaty) vykreslované ze zdroje podobného Markdownu."
reference = { title = "Mermaid documentation", url = "https://mermaid.js.org/intro/" }

[[terms]]
id = "scss"
term = "SCSS"
kind = "language"
aliases = ["Sass"]
definition = "CSS with variables, nesting and mixins, compiled by Sass into plain CSS."
definition_cs = "CSS s proměnnými, vnořováním a mixiny, kompilované nástrojem Sass do běžného CSS."
reference = { title = "Sass documentation", url = "https://sass-lang.com/documentation/" }

[[terms]]
id = "fastapi"
term = "FastAPI"
kind = "technology"
definition = "A Python web framework for HTTP APIs, typed with Pydantic models that validate requests and generate the OpenAPI description."
definition_cs = "Webový framework v Pythonu pro HTTP API, typovaný modely Pydantic, které validují požadavky a generují popis OpenAPI."
reference = { title = "FastAPI documentation", url = "https://fastapi.tiangolo.com/" }

[[terms]]
id = "react"
term = "React"
kind = "technology"
aliases = ["React.js"]
definition = "A JavaScript library for user interfaces built from components that re-render from state."
definition_cs = "JavaScriptová knihovna pro uživatelská rozhraní skládaná z komponent, které se překreslují podle stavu."
reference = { title = "react.dev", url = "https://react.dev/learn" }

[[terms]]
id = "playwright"
term = "Playwright"
kind = "technology"
definition = "A browser automation library that drives Chromium, Firefox and WebKit for end-to-end tests and audits."
definition_cs = "Knihovna pro automatizaci prohlížeče, která ovládá Chromium, Firefox a WebKit pro end-to-end testy a audity."
reference = { title = "Playwright documentation", url = "https://playwright.dev/docs/intro" }

[[terms]]
id = "kubernetes"
term = "Kubernetes"
kind = "technology"
aliases = ["k8s"]
definition = "A system that runs containers across a cluster: scheduling, scaling, networking and rollouts declared as resources."
definition_cs = "Systém, který provozuje kontejnery v clusteru: plánování, škálování, síť a nasazování deklarované jako zdroje."
reference = { title = "Kubernetes documentation", url = "https://kubernetes.io/docs/concepts/overview/" }

[[terms]]
id = "github-actions"
term = "GitHub Actions"
kind = "technology"
definition = "GitHub's continuous integration: workflows of jobs that build, test and deploy a repository on every push or on a schedule."
definition_cs = "Průběžná integrace GitHubu: workflow s úlohami, které sestaví, otestují a nasadí repozitář při každém pushi nebo podle plánu."
reference = { title = "GitHub Actions documentation", url = "https://docs.github.com/en/actions" }

[[terms]]
id = "claude-api"
term = "Claude API"
kind = "technology"
aliases = ["claude-code", "Claude"]
definition = "Anthropic's API to the Claude models: messages, tool use and agents that read, reason and act."
definition_cs = "API společnosti Anthropic k modelům Claude: zprávy, používání nástrojů a agenti, kteří čtou, uvažují a jednají."
reference = { title = "Claude API documentation", url = "https://docs.anthropic.com/" }

[[terms]]
id = "openai-api"
term = "OpenAI API"
kind = "technology"
definition = "OpenAI's API to its language and embedding models, used for text generation, extraction and search."
definition_cs = "API společnosti OpenAI k jejím jazykovým a embeddingovým modelům, používané pro generování textu, extrakci a vyhledávání."
reference = { title = "OpenAI API documentation", url = "https://platform.openai.com/docs/overview" }

[[terms]]
id = "pydantic"
term = "Pydantic"
kind = "technology"
definition = "Data validation for Python from type hints: models that parse, check and serialise input."
definition_cs = "Validace dat v Pythonu z typových anotací: modely, které vstup parsují, kontrolují a serializují."
reference = { title = "Pydantic documentation", url = "https://docs.pydantic.dev/latest/" }

[[terms]]
id = "tesseract"
term = "Tesseract"
kind = "technology"
aliases = ["OCR"]
definition = "An open-source OCR engine that reads text from scanned documents and images in many languages."
definition_cs = "Open-source OCR engine, který čte text ze skenovaných dokumentů a obrázků v mnoha jazycích."
reference = { title = "Tesseract documentation", url = "https://tesseract-ocr.github.io/" }

# Concepts of the services and skills (data/services.toml, data/experience-rules.toml capabilities).

[[terms]]
id = "public-registry"
term = "Public registry"
term_cs = "Veřejný rejstřík"
kind = "concept"
definition = "An official register a state keeps open to the public: companies, insolvencies, property, beneficial owners; the primary source of a due diligence."
definition_cs = "Úřední rejstřík, který stát vede veřejně: firmy, insolvence, nemovitosti, skuteční majitelé; primární zdroj každé due diligence."
reference = { title = "Open Ownership: registers", url = "https://www.openownership.org/en/topics/beneficial-ownership-registers/" }

[[terms]]
id = "beneficial-ownership"
term = "Beneficial ownership"
term_cs = "Skutečné vlastnictví"
kind = "concept"
definition = "The natural person who ultimately owns or controls a company, often behind layers of other companies; registers and chains of shareholdings reveal them."
definition_cs = "Fyzická osoba, která firmu v konečném důsledku vlastní nebo ovládá, často za vrstvami dalších firem; odhalí ji rejstříky a řetězce podílů."
reference = { title = "FATF: beneficial ownership", url = "https://www.fatf-gafi.org/en/topics/beneficial-ownership.html" }

[[terms]]
id = "sanctions-screening"
term = "Sanctions screening"
term_cs = "Sankční prověrka"
kind = "concept"
definition = "Checking people and companies against sanctions lists and politically exposed persons before a business relationship, as anti-money-laundering rules require."
definition_cs = "Kontrola osob a firem proti sankčním seznamům a politicky exponovaným osobám před obchodním vztahem, jak vyžadují pravidla proti praní peněz."
reference = { title = "OpenSanctions documentation", url = "https://www.opensanctions.org/docs/" }

[[terms]]
id = "financial-statement-analysis"
term = "Financial statement analysis"
term_cs = "Analýza účetních výkazů"
kind = "concept"
definition = "Reading a company's health from its balance sheet, income statement and cash flow: ratios, trends and what they do not say."
definition_cs = "Čtení zdraví firmy z rozvahy, výsledovky a cash flow: ukazatele, trendy a to, co neříkají."
reference = { title = "IFRS: financial statements", url = "https://www.ifrs.org/issued-standards/list-of-standards/ias-1-presentation-of-financial-statements/" }

[[terms]]
id = "attack-surface"
term = "Attack surface"
term_cs = "Útočná plocha"
kind = "concept"
definition = "Everything of an organisation an attacker can reach from the internet: domains, servers, services, certificates and leaked credentials."
definition_cs = "Vše z organizace, na co útočník dosáhne z internetu: domény, servery, služby, certifikáty a uniklé přihlašovací údaje."
reference = { title = "OWASP: attack surface analysis", url = "https://cheatsheetseries.owasp.org/cheatsheets/Attack_Surface_Analysis_Cheat_Sheet.html" }

[[terms]]
id = "digital-forensics"
term = "Digital forensics"
term_cs = "Digitální forenzní analýza"
kind = "concept"
definition = "Recovering and examining digital evidence so that what it shows, and how it was obtained, holds up when challenged."
definition_cs = "Získávání a zkoumání digitálních důkazů tak, aby to, co ukazují, i způsob, jak byly získány, obstály při zpochybnění."
reference = { title = "NIST: digital forensics", url = "https://www.nist.gov/digital-evidence" }

[[terms]]
id = "chain-of-custody"
term = "Chain of custody"
term_cs = "Řetězec úschovy"
kind = "concept"
definition = "The record of who acquired a piece of evidence, when and how, and every hand it passed through, so its integrity can be proven."
definition_cs = "Záznam o tom, kdo důkaz získal, kdy a jak, a čímkoli prošel, aby šlo doložit jeho neporušenost."
reference = { title = "NIST CSRC: chain of custody", url = "https://csrc.nist.gov/glossary/term/chain_of_custody" }

[[terms]]
id = "source-criticism"
term = "Source criticism"
term_cs = "Kritika zdrojů"
kind = "concept"
definition = "Judging a source before believing it: who made it, when, how and why, and whether independent sources agree."
definition_cs = "Posouzení zdroje dřív, než se mu uvěří: kdo ho vytvořil, kdy, jak a proč a zda se shodují nezávislé zdroje."
reference = { title = "Wikipedia: source criticism", url = "https://en.wikipedia.org/wiki/Source_criticism" }

[[terms]]
id = "reputation-risk"
term = "Reputation risk"
term_cs = "Reputační riziko"
kind = "concept"
definition = "The risk that what is said about an organisation or a person, true or not, costs it trust, customers or value; monitored through adverse media."
definition_cs = "Riziko, že to, co se o organizaci nebo osobě říká, pravdivé či ne, ji stojí důvěru, zákazníky nebo hodnotu; sleduje se přes negativní zprávy."
reference = { title = "Wikipedia: reputational risk", url = "https://en.wikipedia.org/wiki/Reputational_risk" }

[[terms]]
id = "change-detection"
term = "Change detection"
term_cs = "Detekce změn"
kind = "concept"
definition = "Noticing when a source changes and judging whether the change matters, so an alert means something."
definition_cs = "Zachycení, že se zdroj změnil, a posouzení, zda na změně záleží, aby upozornění něco znamenalo."
reference = { title = "Wikipedia: change detection", url = "https://en.wikipedia.org/wiki/Change_detection" }

[[terms]]
id = "web-scraping"
term = "Web scraping"
kind = "concept"
definition = "Extracting data from web pages by program, from simple requests to a driven browser, within the site's terms and the law."
definition_cs = "Programové získávání dat z webových stránek, od jednoduchých požadavků po řízený prohlížeč, v mezích podmínek webu a zákona."
reference = { title = "Wikipedia: web scraping", url = "https://en.wikipedia.org/wiki/Web_scraping" }

[[terms]]
id = "contestability"
term = "Contestability"
term_cs = "Napadnutelnost"
kind = "concept"
definition = "The property of a decision that can be questioned: its evidence, assumptions, uncertainty and the person accountable are on record."
definition_cs = "Vlastnost rozhodnutí, které lze zpochybnit: jeho důkazy, předpoklady, nejistota i odpovědná osoba jsou zaznamenané."
reference = { title = "OECD AI principles: accountability", url = "https://oecd.ai/en/dashboards/ai-principles/P9" }

[[terms]]
id = "regulatory-compliance"
term = "Regulatory compliance"
term_cs = "Regulatorní shoda"
kind = "concept"
definition = "Meeting the obligations a regulation sets, and being able to show it with evidence, for example under NIS2 for cybersecurity."
definition_cs = "Plnění povinností, které ukládá regulace, a schopnost to doložit důkazy, například podle NIS2 pro kybernetickou bezpečnost."
reference = { title = "EU NIS2 Directive", url = "https://digital-strategy.ec.europa.eu/en/policies/nis2-directive" }

[[terms]]
id = "policy-as-code"
term = "Policy as code"
term_cs = "Pravidla jako kód"
kind = "concept"
definition = "Rules kept as code beside what they govern, checked automatically on every change instead of read and remembered."
definition_cs = "Pravidla vedená jako kód vedle toho, co řídí, kontrolovaná automaticky při každé změně místo čtení a pamatování."
reference = { title = "Open Policy Agent: policy as code", url = "https://www.openpolicyagent.org/docs/latest/" }

[[terms]]
id = "service"
term = "Service"
term_cs = "Služba"
kind = "concept"
definition = "Something the owner offers a client: a problem it solves, the principle it rests on, the method and what is delivered."
definition_cs = "Něco, co vlastník nabízí klientovi: problém, který řeší, princip, na kterém stojí, postup a to, co se odevzdá."
reference = { title = "Schema.org: Service", url = "https://schema.org/Service" }

[[terms]]
id = "skill"
term = "Skill"
term_cs = "Dovednost"
kind = "concept"
definition = "A capability the owner practises, shown by public work and client use cases, and drawn on by the services."
definition_cs = "Schopnost, kterou vlastník praktikuje, doložená veřejnou prací a případy užití z klientské práce, a ze které čerpají služby."
reference = { title = "Schema.org: knowsAbout", url = "https://schema.org/knowsAbout" }

# Technologies the services are built with (data/services.toml stack).

[[terms]]
id = "phoenix"
term = "Phoenix"
kind = "technology"
aliases = ["Phoenix LiveView", "LiveView", "phoenix_live_view"]
definition = "Elixir's web framework; LiveView renders interactive pages on the server and pushes only the changes over a socket."
