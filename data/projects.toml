# Curated catalogue of the projects this hub shows. Hand-written: names, words, grouping.
# Everything measurable (stars, language, last push, whether the live site answers, whether
# the repository is supervised by Majordomus) is derived by `npm run data` into
# data/github.json and is never typed here. Order is display order.
#
# Fields
#   repo        GitHub repository under github.com/korczis (the identity; must exist, public)
#   name        display name
#   tagline     one line, at most 90 characters
#   summary     two or three sentences, plain words, no superlatives
#   category    one of the [categories] keys below
#   url         the live site, if any (checked by `npm run data`)
#   stack       technologies, as shown on the card and as edges in the ecosystem graph
#   featured    shown on the home page
#
# Majordomus supervision is never typed here: it is measured (rule project.data-measured).

# The derived index of every public repository (scripts/fetch-index.mjs). Owner-editable lists:
#   mirrors  upstream code imported with its history squashed (the contributor test cannot see
#            it): counted as mirrors, never listed as the owner's work
#   hidden   the owner's own repositories kept off this professional showcase: counted, not listed
#   window   how many of the most recently active repositories the landing's skillset charts read
[index]
window = 100
mirrors = ["foremost", "libnids", "libnet", "ucl", "upx", "ev", "petitboot", "libtwin", "mongo-cxx-driver", "cyclos", "raspberry-pi", "tsa-keys"]
hidden = ["atp", "microcrawler-crawler-youjizz-com", "the-shit", "chujovinky", "empty-repo"]

# Categories, in sidebar order. Each becomes a page /projects/<key>/ generated by
# scripts/build-categories.mjs (name, description and icon are its words). `keywords` and
# `languages` are the rules scripts/fetch-index.mjs uses to infer the category of every other
# public repository (first category whose keyword appears in the name, description or topics,
# else the first whose language matches, else "tools").
[categories.ai]
name = "AI engineering"
description = "Supervision for AI coding agents: one policy for every tool, scoped tasks, and work that lands only when it is proven."
icon = "shield"
keywords = ["agent", "llm", "ai", "majordomus", "gpt", "claude", "cognitive", "mcp", "prompt", "machine learning", "neural"]
languages = []

