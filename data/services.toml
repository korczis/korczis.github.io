method = ["Normalise names and identifiers", "Screen against the consolidated lists", "Walk the ownership chain to the ultimate beneficial owner", "Check political exposure", "Put near-misses through human review", "Record the decision with its evidence"]
method_cs = ["Normalizovat jména a identifikátory", "Prověřit proti konsolidovaným seznamům", "Projít vlastnický řetězec ke skutečnému majiteli", "Ověřit politickou expozici", "Téměř shody předat k lidskému posouzení", "Zaznamenat rozhodnutí i s důkazy"]
deliverables = ["Screening certificate per subject", "Ownership chain diagram", "Review queue", "Audit-ready compliance report"]
deliverables_cs = ["Osvědčení o prověrce pro každý subjekt", "Diagram vlastnického řetězce", "Fronta k posouzení", "Report o shodě připravený na audit"]
skills = ["sanctions-screening", "ownership-analysis", "entity-resolution", "risk-scoring", "contestable-decisions", "compliance-mapping"]
sources = ["OpenSanctions", "OFAC SDN list", "UN consolidated list", "EU consolidated list", "GLEIF", "Companies House", "Beneficial ownership registers"]
stack = ["Elixir", "PostgreSQL", "OpenAPI"]

