deliverables = ["Master findings and red-flag register", "Decision memo with a walk-away position", "Pre-signing information requests", "Document bundles for the board, the investment committee and counsel", "The case under version control, updated rather than rewritten"]
deliverables_cs = ["Hlavní zjištění a registr varovných signálů", "Rozhodovací memo s hranicí pro odchod", "Žádosti o informace před podpisem", "Balíky dokumentů pro představenstvo, investiční výbor a právníky", "Případ ve verzovacím systému, aktualizovaný místo přepisování"]
skills = ["m-and-a-screening", "due-diligence", "financial-analysis", "ownership-analysis", "market-intelligence", "contestable-decisions", "risk-scoring", "data-room", "decision-support"]
sources = ["ARES", "Commercial Register", "Sbírka listin", "ISIR", "GLEIF", "Companies House", "SEC EDGAR", "Monte Carlo sensitivity analysis"]
stack = ["Elixir", "Phoenix", "PostgreSQL", "Monte Carlo simulation"]

[[services.cases]]
problem = "A private-equity buyer was weighing a software company whose story rested on strategic partnerships."
problem_cs = "Kupec z oblasti private equity zvažoval softwarovou firmu, jejíž příběh stál na strategických partnerstvích."
approach = "Each claimed partnership was checked from the partner's side and in independent sources."
approach_cs = "Každé deklarované partnerství se ověřilo ze strany partnera a v nezávislých zdrojích."
outcome = "The evidence did not support the claims, and the deal moved to conditions that had to be met before signing."
outcome_cs = "Důkazy tvrzení nepodpořily a transakce přešla na podmínky, které musely být splněny před podpisem."

[[services.cases]]
problem = "A seller needed to answer buyers' questions quickly without losing control of what was disclosed."
problem_cs = "Prodávající potřeboval rychle odpovídat na otázky kupců, aniž by ztratil kontrolu nad tím, co zveřejňuje."
approach = "A data room with role-based access, checklists and drafted answers that a human approves."
approach_cs = "Datová místnost s přístupem podle rolí, kontrolními seznamy a připravenými odpověďmi, které schvaluje člověk."
outcome = "Every question and answer was controlled and auditable through the whole process."
outcome_cs = "Každá otázka i odpověď byly po celou dobu pod kontrolou a auditovatelné."

