# What Tomas Korcak offers: the words of each service, in English and Czech, and nothing else.
# Every piece of evidence is derived by scripts/lib/services.mjs: the skills a service draws on
# resolve to the capabilities of data/experience-rules.toml, whose public repositories, client use
# cases (sector and role only) and technologies are measured; scripts/build-services.mjs writes the
# pages (/services/, /skills/) and data/services.json. Rule project.services-derived.
#
# NDA (ADR 0006, rule project.nda-never-named): no client, person, company, project codename,
# private repository, domain, date or number, here or in any case. Public sources (registers,
# lists, standards) are proper nouns and may be named.
#
#   id            the page slug
#   icon          a name templates/components.html `icon` knows
#   name, promise, problem, principle    one line each (the promise is the page description)
#   method        the steps, in order; deliverables  what the client receives
#   skills        capability keys of data/experience-rules.toml, the strongest first
#   sources       public sources and techniques it uses (proper nouns)
#   stack         the languages and technologies it is built with, by glossary name (each needs a term)
#   [[services.cases]]  abstract use cases: the problem, what was done, the outcome

[[services]]
id = "due-diligence"
icon = "shield"
name = "Corporate and counterparty due diligence"
name_cs = "Due diligence firem a protistran"
promise = "Know who you are dealing with before you sign: one resolved entity, every source cross-checked, every red flag explained."
promise_cs = "Vězte, s kým jednáte, dřív než podepíšete: jedna rozpoznaná entita, každý zdroj ověřený proti ostatním, každý varovný signál vysvětlený."
problem = "A partner, supplier or target has to be judged while the facts are scattered across registers, courts and filings, and some are hidden on purpose."
problem_cs = "Partnera, dodavatele nebo cíl je třeba posoudit, zatímco fakta jsou rozptýlená po rejstřících, soudech a výkazech a některá jsou skrytá záměrně."
principle = "Resolve the subject to one entity, cross-check independent sources, flag contradictions instead of averaging them, and grade every finding by depth, from a single-source lookup to an adversarial review."
principle_cs = "Rozpoznat subjekt jako jednu entitu, ověřit nezávislé zdroje navzájem, rozpory označit místo jejich průměrování a každé zjištění odstupňovat podle hloubky, od jednoho zdroje po oponentní prověrku."
method = ["Resolve the subject's identity", "Collect from the registers in parallel", "Map officers, owners and related parties", "Check legal standing: insolvency, litigation, enforcement", "Analyse the filed financial statements", "Score and explain the risk profile"]
method_cs = ["Rozpoznat totožnost subjektu", "Souběžně sebrat data z rejstříků", "Zmapovat statutáry, vlastníky a spřízněné strany", "Prověřit právní stav: insolvence, spory, exekuce", "Analyzovat uložené účetní závěrky", "Ohodnotit a vysvětlit rizikový profil"]
deliverables = ["Red-flag matrix with severity", "Entity relationship graph", "Findings register linked to its evidence", "Executive one-page brief", "Structured data beside the report"]
deliverables_cs = ["Matice varovných signálů se závažností", "Graf vztahů entit", "Registr zjištění propojený s důkazy", "Jednostránkové shrnutí pro vedení", "Strukturovaná data vedle reportu"]
skills = ["due-diligence", "registry-intelligence", "entity-resolution", "ownership-analysis", "financial-analysis", "risk-scoring", "source-reliability", "decision-support"]
sources = ["ARES", "Commercial Register", "Sbírka listin", "ISIR", "ČÚZK cadastre", "Beneficial ownership register", "OpenCorporates", "GLEIF", "Companies House", "SEC EDGAR"]
stack = ["Elixir", "Phoenix", "PostgreSQL", "Meilisearch", "Playwright"]

[[services.cases]]
problem = "A buyer had to know whether a supplier was financially sound and legally clean before a long contract."
problem_cs = "Kupující potřeboval před dlouhodobou smlouvou vědět, zda je dodavatel finančně zdravý a právně čistý."
approach = "Filings, insolvency and court records were checked against each other and against what the supplier had declared."
approach_cs = "Výkazy, insolvenční a soudní záznamy se ověřily navzájem i proti tomu, co dodavatel sám uvedl."
outcome = "An undisclosed enforcement history came to light and the contract terms were changed before signing."
outcome_cs = "Vyšla najevo nezveřejněná exekuční minulost a podmínky smlouvy se před podpisem změnily."

[[services.cases]]
problem = "An investor received a clean \"nothing found\" from a register for the subject of a deal."
problem_cs = "Investor dostal z rejstříku k subjektu transakce čistý výsledek „nic nenalezeno“."
approach = "A positive control re-queried the register with a subject known to be there."
approach_cs = "Pozitivní kontrola zopakovala dotaz se subjektem, o kterém bylo známo, že v rejstříku je."
outcome = "The empty answer was the register's silent false negative; the real record was found and assessed."
outcome_cs = "Prázdná odpověď byla tichou falešnou negativitou rejstříku; skutečný záznam se dohledal a posoudil."

[[services]]
