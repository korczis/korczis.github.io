[[services]]
id = "compliance-screening"
icon = "check"
name = "Sanctions, PEP and beneficial-ownership screening"
name_cs = "Sankční a PEP prověrky a skuteční majitelé"
promise = "Screening that neither drowns you in false positives nor quietly misses a true match."
promise_cs = "Prověrky, které vás nezahltí falešnými shodami ani tiše nepřehlédnou skutečnou."
problem = "Onboarding clients, suppliers or staff requires sanctions, political-exposure and ownership checks a regulator accepts."
