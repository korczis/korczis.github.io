[[services.cases]]
problem = "A lender had to know early when a borrower's group came under pressure."
problem_cs = "Věřitel potřeboval včas vědět, když se skupina dlužníka dostane pod tlak."
approach = "The borrower and its related companies were watched in the insolvency register."
approach_cs = "Dlužník a jeho spřízněné firmy se sledovaly v insolvenčním rejstříku."
outcome = "An insolvency petition against a sister company raised an alert and the lender acted early."
outcome_cs = "Insolvenční návrh na sesterskou firmu vyvolal upozornění a věřitel jednal včas."

[[services.cases]]
problem = "A procurement team relied on suppliers it had vetted once."
problem_cs = "Nákupní tým spoléhal na dodavatele, které jednou prověřil."
approach = "The suppliers' register entries were compared on every refresh."
approach_cs = "Záznamy dodavatelů v rejstříku se porovnávaly při každé obnově."
outcome = "A change in a key supplier's statutory body triggered a new round of vetting."
outcome_cs = "Změna statutárního orgánu klíčového dodavatele spustila nové kolo prověrky."

[[services]]
id = "attack-surface"
icon = "server"
name = "External attack surface and cyber-exposure assessment"
name_cs = "Hodnocení vnější útočné plochy a kybernetické expozice"
promise = "See your organisation, or an acquisition target, the way an attacker sees it."
promise_cs = "Uvidíte svou organizaci, nebo cíl akvizice, očima útočníka."
problem = "Buyers and regulated entities need an outside-in view of exposed assets, leaked credentials and compliance gaps."
problem_cs = "Kupci a regulované subjekty potřebují pohled zvenčí na vystavená aktiva, uniklé přihlašovací údaje a mezery ve shodě."
principle = "Discover domains, addresses, certificates and services, correlate them with threat intelligence, rate the exposure with its evidence and map it to the controls of cybersecurity regulation."
principle_cs = "Objevit domény, adresy, certifikáty a služby, propojit je se zpravodajstvím o hrozbách, ohodnotit expozici i s důkazy a namapovat ji na opatření kybernetické regulace."
method = ["Enumerate the assets", "Fingerprint the services and look up known vulnerabilities", "Check breach and reputation exposure", "Score the risk", "Map the findings to compliance controls such as NIS2", "Set up continuous monitoring"]
method_cs = ["Vyjmenovat aktiva", "Otisknout služby a vyhledat známé zranitelnosti", "Ověřit expozici v únicích a reputaci", "Ohodnotit riziko", "Namapovat zjištění na opatření shody, například NIS2", "Nastavit průběžný monitoring"]
deliverables = ["Exposure report", "Security rating", "Remediation list", "Compliance gap map"]
deliverables_cs = ["Report o expozici", "Bezpečnostní hodnocení", "Seznam náprav", "Mapa mezer ve shodě"]
skills = ["infrastructure-osint", "compliance-mapping", "change-monitoring", "risk-scoring", "web-automation"]
sources = ["Certificate transparency", "Shodan", "Censys", "NVD", "Nmap", "Amass", "Subfinder", "theHarvester"]
stack = ["Elixir", "PostgreSQL", "Phoenix"]

[[services.cases]]
problem = "A buyer wanted to know the cyber exposure of a target before pricing the deal."
problem_cs = "Kupec chtěl znát kybernetickou expozici cíle dřív, než ocení transakci."
approach = "The target's internet-facing assets were enumerated and checked for exposure and leaks."
approach_cs = "Aktiva cíle dostupná z internetu se vyjmenovala a prověřila na expozici a úniky."
outcome = "Forgotten exposed services and leaked credentials were found and priced into the deal."
outcome_cs = "Našly se zapomenuté vystavené služby a uniklé přihlašovací údaje a promítly se do ceny."

[[services.cases]]
problem = "An operator preparing for new cybersecurity obligations did not know where it stood."
problem_cs = "Provozovatel připravující se na nové povinnosti kybernetické bezpečnosti nevěděl, kde stojí."
approach = "Its external evidence was mapped control by control."
approach_cs = "Jeho vnější doklady se namapovaly opatření po opatření."
outcome = "A gap map tied to its own evidence set the order of the remediation."
outcome_cs = "Mapa mezer svázaná s jeho vlastními doklady určila pořadí náprav."

[[services]]
id = "decision-support-ai"
icon = "puzzle"
name = "Decision support and AI agents for analysts"
name_cs = "Podpora rozhodování a AI agenti pro analytiky"
promise = "AI that makes analysts faster without taking their signature away."
promise_cs = "AI, která analytiky zrychlí, ale podpis jim nebere."
problem = "Analyst teams spend their time collecting and formatting instead of judging, and unmanaged AI output cannot be defended."
problem_cs = "Analytické týmy tráví čas sběrem a formátováním místo úsudku a neřízený výstup AI nelze obhájit."
principle = "Agents work through governed tool interfaces; every AI output waits for a human; each decision records its hypotheses, uncertainty, dissent and the person accountable, and predictions are calibrated against outcomes."
principle_cs = "Agenti pracují přes řízená rozhraní nástrojů; každý výstup AI čeká na člověka; každé rozhodnutí zaznamenává hypotézy, nejistotu, nesouhlas a odpovědnou osobu a předpovědi se kalibrují podle výsledků."
method = ["Frame the question as a case", "Let agents collect and transform the material", "Score the hypotheses", "Quantify the uncertainty and show the next evidence worth gathering", "A human reviews and signs", "Record the outcome and recalibrate"]
method_cs = ["Formulovat otázku jako případ", "Nechat agenty sebrat a zpracovat podklady", "Ohodnotit hypotézy", "Vyčíslit nejistotu a ukázat, který další důkaz stojí za sběr", "Člověk posoudí a podepíše", "Zaznamenat výsledek a překalibrovat"]
deliverables = ["Decision record with its explanation", "Calibration reports", "Analyst workspaces and tools"]
deliverables_cs = ["Záznam rozhodnutí s vysvětlením", "Kalibrační reporty", "Pracovní prostředí a nástroje pro analytiky"]
skills = ["llm-agents", "decision-support", "contestable-decisions", "ai-transformation", "orchestration", "document-extraction", "audit-trail"]
sources = ["Model Context Protocol", "Claude", "Local language models", "Monte Carlo simulation", "Bayesian scoring"]
stack = ["Elixir", "MCP", "Claude API", "Ollama", "Phoenix"]

[[services.cases]]
problem = "An analyst team spent most of its time on routine collection."
problem_cs = "Analytický tým trávil většinu času rutinním sběrem."
approach = "Register and media collection moved to agents behind approval gates."
approach_cs = "Sběr z rejstříků a médií přešel na agenty za schvalovacími branami."
outcome = "The team kept the judgement and the signature and spent its time on them."
outcome_cs = "Tým si ponechal úsudek i podpis a věnoval čas jim."

[[services.cases]]
problem = "A decision stalled under broad, open-ended research."
problem_cs = "Rozhodnutí uvázlo v širokém, neohraničeném výzkumu."
approach = "The uncertainty was broken down by what further evidence could reduce."
approach_cs = "Nejistota se rozložila podle toho, co mohou další důkazy snížit."
outcome = "One missing filing drove most of it; the team requested that filing and stopped the rest."
outcome_cs = "Většinu nesl jediný chybějící výkaz; tým si ho vyžádal a zbytek zastavil."

[[services]]
id = "ai-engineering-governance"
icon = "code"
name = "Governed AI-assisted software delivery"
name_cs = "Řízený vývoj softwaru s AI"
promise = "AI agents that write code under rules they cannot skip, with the evidence of every change kept."
promise_cs = "AI agenti, kteří píší kód podle pravidel, která nemohou obejít, a doklady každé změny zůstávají."
problem = "Teams adopt coding agents and lose track of what changed, why, and whether anyone checked it."
problem_cs = "Týmy nasazují kódovací agenty a ztrácejí přehled o tom, co se změnilo, proč a zda to někdo zkontroloval."
principle = "Keep the rules, decisions and handovers in the repository as code, enforce them with gates in hooks and CI, and make every claim of progress pass a verification command."
principle_cs = "Pravidla, rozhodnutí a předávky držet v repozitáři jako kód, vynucovat je branami v hooks a CI a každé tvrzení o postupu nechat projít ověřovacím příkazem."
method = ["Map the repository and its risks", "Write the rules and the decision records", "Wire the gates into hooks and CI", "Run agents inside scoped tasks", "Verify before any claim of progress", "Review the evidence and evolve the rules"]
method_cs = ["Zmapovat repozitář a jeho rizika", "Sepsat pravidla a záznamy rozhodnutí", "Zapojit brány do hooks a CI", "Spouštět agenty uvnitř ohraničených úkolů", "Ověřit dřív, než se ohlásí postup", "Projít doklady a vyvíjet pravidla"]
deliverables = ["A supervised repository layer", "Gates in hooks and CI", "Decision and handover records", "A dashboard of the work and its evidence"]
deliverables_cs = ["Řízená vrstva repozitáře", "Brány v hooks a CI", "Záznamy rozhodnutí a předávek", "Dashboard práce a jejích dokladů"]
skills = ["policy-as-code", "llm-agents", "audit-trail", "orchestration", "ai-transformation", "contestable-decisions"]
sources = ["Majordomus", "Model Context Protocol", "Git hooks", "Continuous integration", "Architecture decision records"]
stack = ["Rust", "MCP", "Claude API", "Majordomus", "GitHub Actions"]

[[services.cases]]
problem = "Several coding agents worked in one repository and overwrote each other's work."
problem_cs = "V jednom repozitáři pracovalo několik kódovacích agentů a přepisovali si práci."
approach = "Each worked in its own scoped task and worktree, announced on a shared board, with gates before every commit and push."
approach_cs = "Každý pracoval ve vlastním ohraničeném úkolu a worktree, ohlašoval se na společné tabuli a před každým commitem a pushem stály brány."
outcome = "Collisions surfaced before they landed, and every change kept its evidence."
outcome_cs = "Kolize se ukázaly dřív, než přistály, a každá změna si ponechala doklady."

[[services]]
id = "interactive-data-products"
icon = "graph"
name = "Interactive data products and simulators"
name_cs = "Interaktivní datové produkty a simulátory"
promise = "Data and models people drive themselves, where every mark leads to its source."
promise_cs = "Data a modely, které lidé sami ovládají a kde každá značka vede ke svému zdroji."
problem = "Reports and static charts hide the model behind them; readers cannot ask their own questions of the data."
problem_cs = "Reporty a statické grafy skrývají model, který za nimi stojí; čtenáři nemohou datům klást vlastní otázky."
principle = "Build the model first and let the reader drive it: parameters, time and filters in the address, every mark linked to its evidence, accessible and fast on a phone."
principle_cs = "Nejdřív postavit model a nechat čtenáře ho řídit: parametry, čas a filtry v adrese, každá značka propojená s doklady, přístupně a rychle i na telefonu."
method = ["Find the question the data must answer", "Model it and measure the inputs", "Design the interaction around the question", "Link every mark to its source", "Test accessibility and performance", "Ship it as a page that refreshes itself"]
method_cs = ["Najít otázku, na kterou mají data odpovědět", "Vymodelovat ji a změřit vstupy", "Navrhnout interakci kolem otázky", "Propojit každou značku se zdrojem", "Otestovat přístupnost a výkon", "Nasadit jako stránku, která se sama obnovuje"]
deliverables = ["An interactive site or dashboard", "The data pipeline behind it", "Accessibility and performance audit"]
deliverables_cs = ["Interaktivní web nebo dashboard", "Datová pipeline za ním", "Audit přístupnosti a výkonu"]
skills = ["interactive-visualisation", "geospatial-analysis", "data-integration", "knowledge-graph", "decision-support"]
sources = ["Apache ECharts", "D3", "p5.js", "Web Audio", "PostGIS", "GitHub Pages"]
stack = ["Apache ECharts", "D3", "p5.js", "Web Audio", "PostGIS", "Zola"]

[[services.cases]]
problem = "A crisis had to be followed on a map from reports that arrived as free text."
problem_cs = "Krizi bylo potřeba sledovat na mapě z hlášení, která přicházela jako volný text."
approach = "Reports were geocoded locally, stored as geography and served through one registry to a live map and an API."
approach_cs = "Hlášení se lokálně geokódovala, uložila jako geografie a přes jeden registr se servírovala živé mapě i API."
outcome = "Readers could filter the events in place and time and follow each to its report."
outcome_cs = "Čtenáři mohli události filtrovat v místě a čase a každou sledovat až k hlášení."
