# The public vocabulary of the experience section: sectors, capabilities, domains, roles and
# technologies, each a key with its English and Czech words. scripts/mine-experience.mjs measures
# the owner's private engagement sources and writes data/experience.json in these keys only, so
# nothing but this vocabulary, rounded numbers and dates ever reaches the site (legal NDA: no
# client, person, repository or project name). scripts/check-experience.mjs checks that every key
# the data uses exists here.
#
#   [scale]         bucket floors: a measured count is published as the largest floor it reaches
#   [inference]     how a capability is inferred from private text (score = sum over channels of
#                   weight * log2(1 + matching items); kept when score >= threshold, score >=
#                   relative * the engagement's best score, and at least min_items items matched);
#                   the matched text itself is never kept
#   [sectors.*]     generic industries a client belongs to (declared by the owner, never inferred)
#   [domains.*]     the three areas the capabilities group into: words, an icon of templates/components.html,
#                   and the catalogue category and glossary term each links to
#   [capabilities.*] name, description (EN + CS), domain, the glossary term it links to, the
#                   catalogue categories that share it, and the keywords that infer it. A keyword is
#                   matched as whole words after lower-casing and stripping diacritics; a trailing *
#                   matches any word that starts with it
#   [roles.*]       what the owner did in an engagement (declared by the owner, never inferred)
#   [technologies.*] public technology names, detected from file extensions (language), dependency
#                   manifests (deps) or marker paths (paths); only names listed here are published

# The order the section shows the domains in (a TOML table has none a template can rely on).
domain_order = ["dd", "ai", "data"]

[scale]
buckets = [1, 2, 3, 5, 10, 25, 50, 100, 250, 500, 1000, 2500, 5000, 10000]

[inference]
threshold = 2.5
relative = 0.3
min_items = 3
weights = { commits = 1.0, headings = 1.0, paths = 0.35 }
# Public work (data/recent.json) is short text: its own, lower threshold.
public_threshold = 2.0

# The engagement card names what was solved: its roles, then the descriptions of its strongest
# capabilities (data/experience.json keeps them by score); the rest stay as chips.
[display]
solved = 4

