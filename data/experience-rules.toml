# --- Roles ---------------------------------------------------------------------------------------

[roles.architect]
name = "Architect"
name_cs = "Architekt"
description = "Designed the system and its data model, and set the rules it is built and checked by."
description_cs = "Navrhl systém a jeho datový model a stanovil pravidla, podle kterých se staví a kontroluje."

[roles.lead-engineer]
name = "Lead engineer"
name_cs = "Vedoucí inženýr"
description = "Led the engineering: wrote much of the code, reviewed the rest and kept it shipping."
description_cs = "Vedl vývoj: napsal velkou část kódu, revidoval zbytek a udržel ho v provozu."

[roles.ai-engineer]
name = "AI engineer"
name_cs = "Inženýr AI"
description = "Built the AI parts: models, agents, prompts and the evaluations that keep them honest."
description_cs = "Postavil části s AI: modely, agenty, prompty a vyhodnocení, která je drží poctivé."

[roles.data-engineer]
name = "Data engineer"
name_cs = "Datový inženýr"
description = "Built the connectors, pipelines and stores the evidence flows through."
description_cs = "Postavil konektory, pipeline a úložiště, kterými podklady tečou."

[roles.investigator]
name = "Investigator"
name_cs = "Analytik šetření"
description = "Ran the investigation from open sources and wrote up the findings with their evidence."
description_cs = "Vedl šetření z otevřených zdrojů a sepsal zjištění i s jejich důkazy."

[roles.advisor]
name = "Advisor"
name_cs = "Poradce"
description = "Advised on approach, risks and the technology choices, and reviewed the outcome."
description_cs = "Radil s postupem, riziky a volbou technologií a posoudil výsledek."

