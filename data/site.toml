text = "Tailwind compiles Flowbite Pro styles; Zola builds both languages, internal links are errors."
text_cs = "Tailwind kompiluje styly Flowbite Pro; Zola staví oba jazyky, interní odkazy jsou chyby."

[[stack.pipeline]]
title = "Gate"
