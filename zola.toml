base_url = "https://korczis.github.io"
title = "Tomas Korcak"
description = "Software for evidence: AI agents that prove their work, honest instruments in the browser, knowledge you can check."
default_language = "en"
compile_sass = false
minify_html = false
build_search_index = false
# The only "feed" is the command palette's index (templates/palette.json), one file per language.
generate_feeds = true
feed_filenames = ["palette.json"]
author = "Tomas Korcak"
taxonomies = [{ name = "tags", feed = false }]

[markdown]
render_emoji = false
external_links_target_blank = true
external_links_no_follow = false
external_links_no_referrer = true
smart_punctuation = true

[link_checker]
internal_level = "error"
external_level = "warn"

[extra]
author = "Tomas Korcak"
author_native = "Tomáš Korčák" # the same name with its Czech diacritics: JSON-LD alternateName
github = "korczis"
# GitLab is its own account: never assume it shares the GitHub login (generators read it too).
gitlab = "korczis"
# The place, with a Czech twin per form a sentence needs (the hero says "in Brno" / "z Brna").
location = "Brno, Czech Republic"
location_cs = "Brno, Česko"
location_in = "in Brno, Czech Republic"
location_in_cs = "z Brna"
repo_url = "https://github.com/korczis/korczis.github.io"
majordomus_url = "https://majordomus.dev"
# Swagger UI hosted by its maintainers: the interfaces menu and page open static/openapi.json in it.
swagger_ui = "https://petstore.swagger.io/?url="
majordomus_build = "https://majordomus.dev/build.json"
majordomus_install = "curl -fsSL https://majordomus.dev/install.sh | sh"

[languages.cs]
# The only "feed" is the command palette's index (templates/palette.json), one file per language.
generate_feeds = true
feed_filenames = ["palette.json"]
title = "Tomáš Korčák"
description = "Software, který svou práci dokládá: AI agenti, kteří prokazují výsledky, poctivé přístroje v prohlížeči, ověřitelné znalosti."
taxonomies = [{ name = "tags", feed = false }]

