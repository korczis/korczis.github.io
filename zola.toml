derive_services_intro = "Nabízím {n} služeb: {list}. Každá stránka říká, jaký problém řeší, na jakém principu stojí, jaký je postup krok za krokem a co dostanete, a pak ukazuje dovednosti, ze kterých čerpá, technologie, veřejnou práci, která je dokládá, a případy užití z klientské práce."
derive_services_how = "Jak to vzniká: slova každé služby jsou moje; vše ostatní je odvozené z měřených dat. Dovednosti vycházejí ze stejného slovníku jako zkušenosti s [[osint|vyšetřováním]] a [[due-diligence|due diligence]] na úvodní stránce, doklady pocházejí z mých veřejných repozitářů a klientská práce je popsaná bez jakéhokoli jména, data či čísla."
derive_skills_intro = "{n} dovedností nese mých {services} služeb. Každá má vlastní stránku: co to je, které služby z ní čerpají, s jakými technologiemi se praktikuje, veřejná práce, která ji dokládá, a případy užití z klientské práce, kde byla použita."
derive_skills_how = "Jak to vzniká: dovednost je schopnost ze slovníku zkušeností, takže stejná klíčová slova, která ji odvozují z mé práce, ji propojují i sem; její veřejné doklady a případy užití jsou odvozené, nikdy ručně psané. [[knowledge-graph|Graf]] propojuje dovednosti se službami a technologiemi."
