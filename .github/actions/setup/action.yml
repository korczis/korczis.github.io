name: Toolchain
description: >-
  Node.js 22 with npm ci, Zola pinned by .zola-version and a SHA-256 digest, and on request the
  Chromium headless shell of the locked playwright-core, cached. Every workflow sets up through
  here, so there is one setup-node version and one Node version to keep current.

inputs:
  zola:
    description: Install Zola (false for jobs that only run Node scripts)
    default: 'true'
  browser:
    description: Install the Chromium headless shell for scripts/audit-ui.mjs
    default: 'false'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm

    - name: npm ci
      shell: bash
      run: npm ci

    - name: Install Zola
      if: inputs.zola == 'true'
      shell: bash
      env:
        # Digest of zola-v<version>-x86_64-unknown-linux-gnu.tar.gz for the version in .zola-version.
        # Changing .zola-version without updating it fails here, loudly.
        ZOLA_SHA256: 54d1a347781b2f32330914fcc02def81c7e3ddb6111b36d1cc89c06557aed1de
      run: |
        version="$(tr -d '[:space:]' < .zola-version)"
        archive="zola-v${version}-x86_64-unknown-linux-gnu.tar.gz"
        curl -fsSL -o "$RUNNER_TEMP/$archive" "https://github.com/getzola/zola/releases/download/v${version}/${archive}"
        echo "${ZOLA_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
        mkdir -p "$RUNNER_TEMP/zola"
        tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/zola"
        echo "$RUNNER_TEMP/zola" >> "$GITHUB_PATH"
        "$RUNNER_TEMP/zola/zola" --version

    # The browser build belongs to the playwright-core version, so that version is the cache key:
    # a bump downloads once, every other run restores it.
    - name: Browser version
      if: inputs.browser == 'true'
      id: browser
      shell: bash
      run: echo "playwright=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"
    - name: Cache the browser
      if: inputs.browser == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: ms-playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.browser.outputs.playwright }}
    - name: Install the Chromium headless shell
      if: inputs.browser == 'true'
      shell: bash
      run: npx playwright-core install chromium-headless-shell
