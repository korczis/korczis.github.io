name: Pages

# master: validate -> deploy -> verify production. Each stage runs only if the previous one passed.
# Every job runs on vars.PAGES_RUNNER when it is set (the dedicated lundra runner of
# scripts/lundra-runner.sh, ADR 0002), else on GitHub-hosted ubuntu-latest.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    with:
      runner: ${{ vars.PAGES_RUNNER || 'ubuntu-latest' }}
    secrets: inherit
    permissions:
      contents: read

  deploy:
    name: Deploy
    needs: ci
    runs-on: ${{ vars.PAGES_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.redeploy.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url || steps.redeploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          zola: 'false'
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6
      - name: Pages base URL matches zola.toml
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          expected="$(python3 -c 'import tomllib; print(tomllib.load(open("zola.toml", "rb"))["base_url"])')"
          echo "configure-pages: $PAGES_BASE_URL"
          echo "zola.toml:       $expected"
          test "${PAGES_BASE_URL%/}" = "${expected%/}"
      - name: Download the validated site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: site
      # The artifact that is about to go public, read once more for denylisted names.
      - name: No denylisted name in the site that deploys (NDA)
        env:
          NDA_DENYLIST: ${{ secrets.NDA_DENYLIST }}
        run: |
          node scripts/check-nda.mjs --site site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # deploy-pages fails now and then with "Fetching artifact metadata failed" right after the
      # upload (the artifact is not yet visible to the Pages API). One fresh upload under a new name
      # and a second deploy get past it; any other failure fails the second deploy as well.
      - name: Deploy
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Wait before the second attempt
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - name: Upload Pages artifact again
        if: steps.deployment.outcome == 'failure'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          name: github-pages-retry
      - name: Deploy again
        id: redeploy
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-retry

  verify:
    name: Verify production
    needs: deploy
    runs-on: ${{ vars.PAGES_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      BASE_URL: ${{ needs.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          zola: 'false'
          browser: 'true'
      - name: Production serves this commit
        run: |
          for attempt in $(seq 1 40); do
            if curl -fsS "${BASE_URL}revision.txt?nocache=${GITHUB_SHA}" | grep -qx "$GITHUB_SHA"; then
              echo "production serves $GITHUB_SHA (attempt $attempt)"
              break
            fi
            [ "$attempt" = 40 ] && { echo "production does not serve $GITHUB_SHA after 10 minutes" >&2; exit 1; }
            sleep 15
          done
      - name: Download the deployed site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: site
      # Derived from the artifact, never a hand-kept list: every section's page, the vendored and
      # site scripts, the CSS and the machine-readable files, each byte-identical to what was built.
      - name: Smoke test (production serves exactly the artifact)
        run: |
          set -euo pipefail
          cd site
          paths=$( { echo index.html; ls -d -- */index.html cs/*/index.html 2>/dev/null || true; ls -- js/*.js js/vendor/*.js js/viz/*.js css/*.css 2>/dev/null || true; ls -- llms*.txt sitemap.xml site.json favicon.svg 2>/dev/null || true; } | sort -u)
          count=0
          for file in $paths; do
            path="${file%index.html}"
            want="$(sha256sum < "$file" | cut -d' ' -f1)"
            got="$(curl -fsS "${BASE_URL}${path}?nocache=${GITHUB_SHA}" | sha256sum | cut -d' ' -f1)"
            if [ "$want" != "$got" ]; then echo "production differs from the artifact: /${path}" >&2; exit 1; fi
            count=$((count + 1))
          done
          echo "production serves $count files byte-identical to the artifact"
      # The public site, in a real browser: the same audit as CI, against production.
      - name: Production in the browser (axe-core WCAG 2.2 AA, CLS, overflow, visuals, links)
        run: SITE_DIR=site node scripts/audit-ui.mjs --shots "$RUNNER_TEMP/shots"
      - name: Every live project site answers
        run: node scripts/check-live.mjs
      - name: Upload production screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: production-screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 7
          if-no-files-found: ignore
