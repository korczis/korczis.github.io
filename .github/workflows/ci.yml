name: CI

# Runs on every branch but master, on every pull request into master (the merge result, and the
# commit lint over exactly the pull request's commits), and is called by pages.yml for master, so
# the gate in front of a deployment is exactly the gate in front of a merge. A newer push to a
# branch or a pull request cancels the run it supersedes.
on:
  push:
    branches-ignore: [master]
  pull_request:
    branches: [master]
  workflow_call:
    inputs:
      runner:
        description: Runner label for every job (pages.yml passes vars.PAGES_RUNNER)
        type: string
        default: ''
    secrets:
      MAJORDOMUS_KIT_EVIDENCE_FLOWBITE_PRO:
        required: false
      NDA_DENYLIST:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

jobs:
  commits:
    name: Conventional commits
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 5
    env:
      # The last commit of the previous site; its history predates the convention.
      IMPORT_BASE: b7059d5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Lint commit subjects
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          head="${PR_HEAD:-$GITHUB_SHA}"
          if [ -n "$PR_BASE" ]; then
            range="$PR_BASE..$head"
          elif [ -n "$PUSH_BEFORE" ] && git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
            range="$PUSH_BEFORE..$head"
          else
            range="$IMPORT_BASE..$head"
          fi
          scripts/lint-commits.sh "$range"

  supervision:
    name: Majordomus supervision
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      MAJORDOMUS_VERSION: v1.0.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install majordomus (pinned; the installer verifies the SHA-256 of the release)
        run: |
          curl -fsSL https://majordomus.dev/install.sh | sh -s -- --version "$MAJORDOMUS_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # A public tree that declares ui.kit flowbite-pro fails closed without the licence evidence:
      # the owner sets the secret once (README, "Deploy"); agents never write it.
      - name: majordomus doctor
        env:
          MAJORDOMUS_KIT_EVIDENCE_FLOWBITE_PRO: ${{ secrets.MAJORDOMUS_KIT_EVIDENCE_FLOWBITE_PRO }}
        run: |
          git config core.hooksPath .githooks
          majordomus version
          majordomus doctor
      # The skill the fleet pack ships is proven here (.ai/repo/ci/gates.yaml, gate skills-proof).
      - name: majordomus skills verify
        run: majordomus skills verify

  validate:
    name: Validate, build and audit
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      # Full history: the NDA gate scans every commit message of origin/master..HEAD.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          browser: 'true'
      # Every offline gate, from the one list (scripts/gates.mjs); ci: false gates say why they skip.
      # --keep-going: one failing gate (a missing secret) must not hide every other gate's verdict.
      - name: Every gate (scripts/gates.mjs)
        env:
          NDA_DENYLIST: ${{ secrets.NDA_DENYLIST }}
        run: node scripts/gates.mjs run --ci --keep-going
      - name: Stamp the revision
        run: printf '%s\n' "$GITHUB_SHA" > public/revision.txt
      # The same audit as npm run verify: its own build on a free port, the server stopped by a trap.
      - name: Accessibility, layout, visuals and links (axe-core WCAG 2.2 AA, CLS, overflow)
        if: ${{ !cancelled() }}
        env:
          NDA_DENYLIST: ${{ secrets.NDA_DENYLIST }}
        run: scripts/verify-all.sh --audit-only --shots "$RUNNER_TEMP/shots"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload the site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: public
          retention-days: 7
