name: Refresh

# Keeps the hub current without anyone maintaining it: every six hours (and on demand) it measures
# GitHub and GitLab again, re-derives everything that follows from the data, runs every gate, and
# only when they all pass commits the result to master and starts the deploy. A failing gate
# leaves the site as it was.
#
# GitHub drops scheduled runs under load (2026-11-13..16: two of four a day ran), so the schedule
# fires hourly and measures once the data on master is REFRESH_HOURS old (an hour of margin for
# the schedule's jitter); a younger run stops after the checkout. A dropped run costs an hour, not
# six. A run started by hand always measures. REFRESH_HOURS is the cadence the pages describe.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Measure, derive, gate, commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      MAJORDOMUS_VERSION: v1.0.1
      REFRESH_HOURS: 6
    steps:
      # Full history: the commit hooks run majordomus doctor, whose clone checks read it.
      # The tip of master when the run starts, not the commit the schedule event was created on:
      # a run that waited in the concurrency group behind another would otherwise judge (and
      # measure) the data that run has already replaced, and its push would be refused.
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0
      # Due when started by hand, or when the data is older than REFRESH_HOURS - 1 (no install).
      # After a failed scheduled run the next attempt waits REFRESH_HOURS - 1 as well, so a gate
      # that stays red fails four times a day, as it did before the hourly schedule, not 24.
      - name: Is a refresh due?
        id: due
        env:
          EVENT: ${{ github.event_name }}
        run: |
          due_after=$((REFRESH_HOURS - 1))
          if [ "$EVENT" != schedule ]; then
            echo "due=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if MAX_HOURS="$due_after" node scripts/check-fresh.mjs; then
            echo "not due: the data on master is younger than $due_after h"; exit 0
          fi
          failed=$(gh run list --workflow refresh.yml --event schedule --status failure --limit 1 \
            --json createdAt --jq '.[0].createdAt // empty')
          since=$(( $(date +%s) - $(date -d "${failed:-1970-01-01T00:00:00Z}" +%s) ))
          if [ "$since" -lt $((due_after * 3600)) ]; then
            echo "not due: the scheduled run of $failed failed; next attempt $due_after h after it"
            exit 0
          fi
          echo "due=true" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup
        if: steps.due.outputs.due == 'true'
      # The refresh commits like anyone else: through the repository's hooks (Majordomus doctor on
      # commit, finish --check on push), never around them. Pinned like CI; the installer verifies
      # the release's SHA-256.
      - name: Install majordomus
        if: steps.due.outputs.due == 'true'
        run: |
          curl -fsSL https://majordomus.dev/install.sh | sh -s -- --version "$MAJORDOMUS_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          git config core.hooksPath .githooks
      # scripts/build-og.mjs renders a card with rsvg-convert and quantises it with pngquant whenever
      # its SVG changed (a new repository, a moved one); build-og --check fails when a package of its
      # RENDERERS is missing from this line. Ubuntu ships pngquant 2.x: data/og.json records the
      # version that wrote each card, and a version alone never re-renders one.
      - name: Renderer and encoder for the Open Graph images
        if: steps.due.outputs.due == 'true'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends librsvg2-bin pngquant
      # GitLab reads have a 15-minute budget per fetcher and then keep the last measurement
      # (scripts/lib/gitlab.mjs); the step limit is the backstop, never the plan.
      - name: Measure (GitHub, GitLab, majordomus.dev; the last 12, 24 and 48 months)
        if: steps.due.outputs.due == 'true'
        timeout-minutes: 45
        run: npm run --silent data && npm run --silent index && npm run --silent recent
      - name: Derive (categories, work pages, llms.txt, OG images, site.json)
        if: steps.due.outputs.due == 'true'
        run: npm run --silent derive
      - name: Every gate (scripts/gates.mjs run --ci)
        if: steps.due.outputs.due == 'true'
        env:
          NDA_DENYLIST: ${{ secrets.NDA_DENYLIST }}
        run: npm run --silent check
      - name: Commit and deploy when something changed
        if: steps.due.outputs.due == 'true'
        # The push runs the pre-push hook, whose gates include the NDA gate: in CI it fails
        # closed without the denylist, so this step needs the secret as the gate step does.
        env:
          MAJORDOMUS_KIT_EVIDENCE_FLOWBITE_PRO: ${{ secrets.MAJORDOMUS_KIT_EVIDENCE_FLOWBITE_PRO }}
          NDA_DENYLIST: ${{ secrets.NDA_DENYLIST }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "nothing changed"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(data): refresh the snapshot and the index"
          git push origin HEAD:master
          # A push made with GITHUB_TOKEN starts no workflow; start the deploy explicitly.
          gh workflow run pages.yml --ref master
