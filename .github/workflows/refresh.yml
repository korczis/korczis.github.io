name: Refresh

# Keeps the hub current without anyone maintaining it: every six hours (and on demand) it measures
# GitHub and GitLab again, re-derives everything that follows from the data, runs every gate, and
# only when they all pass commits the result to master and starts the deploy. A failing gate
# leaves the site as it was.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Measure, derive, gate, commit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      MAJORDOMUS_VERSION: v1.0.1
    steps:
      # Full history: the commit hooks run majordomus doctor, whose clone checks read it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # The refresh commits like anyone else: through the repository's hooks (Majordomus doctor on
      # commit, finish --check on push), never around them. Pinned like CI; the installer verifies
      # the release's SHA-256.
      - name: Install majordomus
        run: |
          curl -fsSL https://majordomus.dev/install.sh | sh -s -- --version "$MAJORDOMUS_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          git config core.hooksPath .githooks
      - name: Renderer for the Open Graph images
        run: sudo apt-get install -y --no-install-recommends librsvg2-bin
      # GitLab reads have a 15-minute budget per fetcher and then keep the last measurement
      # (scripts/lib/gitlab.mjs); the step limit is the backstop, never the plan.
      - name: Measure (GitHub, GitLab, majordomus.dev; the last 12, 24 and 48 months)
        timeout-minutes: 45
        run: npm run --silent data && npm run --silent index && npm run --silent recent
      - name: Derive (categories, work pages, llms.txt, OG images, site.json)
        run: npm run --silent derive
      - name: Every gate (data, front matter, derived files, viz layer, build, SEO)
        run: npm run --silent check
      - name: Commit and deploy when something changed
        env:
          MAJORDOMUS_KIT_EVIDENCE_FLOWBITE_PRO: ${{ secrets.MAJORDOMUS_KIT_EVIDENCE_FLOWBITE_PRO }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "nothing changed"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(data): refresh the snapshot and the index"
          git push origin HEAD:master
          # A push made with GITHUB_TOKEN starts no workflow; start the deploy explicitly.
          gh workflow run pages.yml --ref master
