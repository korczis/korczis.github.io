# Weekly, grouped dependency updates. Every version in package.json is exact on purpose, so an
# update is a reviewed pull request that runs the full gate (ci.yml), never a silent drift.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      site:
        patterns: ['*']
    ignore:
      # Pinned to the Chromium build already cached on the owner's Mac (1.63.0 = Chromium 1243,
      # shared with Kompendium); a bump downloads another browser locally. Raise it by hand,
      # together with the sibling repositories.
      - dependency-name: playwright-core
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      # p5 2.4.0 fetches its friendly-error translations on every load: `./<language>.json` beside
      # the page (a 404 on every page with a sketch, which the browser audit fails), then
      # cdn.jsdelivr.net (a third-party request the self-hosted site never makes). 2.3.x does
      # neither. Lift this when a release can be loaded without either request.
      - dependency-name: p5
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
    commit-message:
      prefix: build
      include: scope
  # The composite action pins actions too (setup-node, cache): scan it with the workflows.
  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
