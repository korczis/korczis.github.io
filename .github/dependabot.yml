# Weekly, grouped dependency updates. Every version in package.json is exact on purpose, so an
# update is a reviewed pull request that runs the full gate (ci.yml), never a silent drift.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      site:
        patterns: ['*']
    ignore:
      # Pinned to the Chromium build already cached on the owner's Mac (1.63.0 = Chromium 1243,
      # shared with Kompendium); a bump downloads another browser locally. Raise it by hand,
      # together with the sibling repositories.
      - dependency-name: playwright-core
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
    commit-message:
      prefix: build
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
