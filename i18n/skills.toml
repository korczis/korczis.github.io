# The evidence of a language or technology on its glossary page (templates/term.html, the article
# scripts/build-glossary.mjs derives from scripts/lib/skills.mjs). Client work appears as use cases
# only: the sector, the roles and what was solved, never a name, a date or a number (ADR 0006).
# [[term-id|label]] links a term; keys with __one, __few, __other are chosen for their {n}.

[derive_skill_language__one]
en = "I have written {term} in {n} public repository, from {first} to {last}{primary}."
cs = "{term} jsem psal v {n} veřejném repozitáři, od roku {first} do {last}{primary}."
[derive_skill_language__few]
en = "I have written {term} in {n} public repositories, from {first} to {last}{primary}."
cs = "{term} jsem psal ve {n} veřejných repozitářích, od roku {first} do {last}{primary}."
[derive_skill_language__other]
en = "I have written {term} in {n} public repositories, from {first} to {last}{primary}."
cs = "{term} jsem psal v {n} veřejných repozitářích, od roku {first} do {last}{primary}."

[derive_skill_primary__one]
