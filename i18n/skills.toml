[derive_skill_none]
en = "No public repository of mine uses {term} as the data measures it; the evidence is the client work described below."
cs = "Žádný můj veřejný repozitář {term} podle měřených dat nepoužívá; dokladem je klientská práce popsaná níže."

[derive_skill_nothing]
en = "No public repository or client engagement of mine uses {term} as the data measures it; this page explains the term where the site uses it."
cs = "Žádný můj veřejný repozitář ani klientská zakázka {term} podle měřených dat nepoužívá; tato stránka pojem vysvětluje tam, kde ho web používá."

[derive_skill_for]
en = "What it was for: {list}."
cs = "K čemu to sloužilo: {list}."

[derive_skill_recent]
en = "Most recently: {list}."
cs = "Naposledy: {list}."

[derive_skill_sites__one]
en = "{n} of these projects runs as a live site."
cs = "{n} z těchto projektů běží jako živý web."
[derive_skill_sites__few]
