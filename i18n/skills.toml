cs = "{n} z těchto projektů běží jako živé weby."

[derive_skill_clients]
en = "I also used it in client work under confidentiality agreements. Roles: {roles}. What was solved: {solved}. The use cases below give the principle and the intent of that work; no client, person, date or number is named."
cs = "Používal jsem ho také v klientské práci pod dohodami o mlčenlivosti. Role: {roles}. Co se řešilo: {solved}. Případy užití níže popisují princip a záměr této práce; žádný klient, osoba, datum ani číslo nejsou uvedeny."

[derive_skill_how]
en = "How to read the evidence: every [[repository|repository]] below is measured from GitHub and GitLab ({cadence}) and says how it uses {term}: as the main language, as a measured share of its code, in its declared stack or as a topic. The reference graph links {term} to the repositories and to the other languages and technologies they use together."
cs = "Jak číst doklady: každý [[repository|repozitář]] níže je změřený z GitHubu a GitLabu ({cadence}) a říká, jak {term} používá: jako hlavní jazyk, měřeným podílem kódu, v deklarovaném stacku nebo jako téma. Graf referencí spojuje {term} s repozitáři a s dalšími jazyky a technologiemi, které spolu používají."

