# The canvas and force simulators (static/js/viz/constellation.js, pulse.js, atlas.js): their
# parameters, filters and the texts they draw. A text with a count has its plural forms
# (key__one, key__few, key__other), picked by KorczisHub.t through Intl.PluralRules.

# constellation: the galaxy of every repository
[js_constellation_year]
en = "Year"
cs = "Rok"

[js_constellation_now]
en = "{year} (today)"
cs = "{year} (dnes)"

[js_constellation_speed]
