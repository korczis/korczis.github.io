# Date formats per language (Zola's date filter, chrono): English writes the month, Czech the
# numeric day and month (17. 11. 2026). Zola ignores date_locale for month names, so a month and
# year takes its name from month_<n> below.
[date_locale]
en = "en_GB"
cs = "cs_CZ"

[fmt_date_long]
en = "%-d %B %Y"
cs = "%-d.\u00a0%-m.\u00a0%Y"

[fmt_date_short]
en = "%-d %b %Y"
cs = "%-d.\u00a0%-m.\u00a0%Y"

[fmt_day]
en = "%-d %b"
cs = "%-d.\u00a0%-m."


