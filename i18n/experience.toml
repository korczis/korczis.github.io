# The experience section (templates/partials/experience.html) and its simulator
# (static/js/viz/experience.js). Every text describes the kind of problem, never a result the data
# (data/experience.json) does not hold; clients stay unnamed under confidentiality agreements.
# Counts are bucket floors: {n} is exact up to 3 and "{n}+" above (the template and script add +).

