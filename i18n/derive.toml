# The glossary (scripts/build-glossary.mjs)

[derive_glossary_article]
en = """
The glossary is the shared language of the whole site. Every page names the terms it builds on in its [[front-matter|front matter]] and ends by explaining them; a term's page in turn shows every page that uses it and the terms that appear alongside. These links are derived, never typed by hand.

Each definition is short, in plain words, and points to a source to read further: documentation, a specification or an encyclopedia. Terms come in three kinds: programming languages, technologies and concepts.

The map at the top draws the same links as a network: every term is a star, larger by the pages that name it, and threads lead to the terms that appear on the same pages. Such a map is called a co-occurrence graph; the terms at its centre are the ones that hold the site together."""
cs = """
Slovník je společný jazyk celého webu. Každá stránka ve svém [[front-matter]] jmenuje pojmy, na kterých stojí, a končí jejich výkladem; stránka pojmu naopak ukazuje všechny stránky, které ho používají, a pojmy, které se objevují s ním. Vazby se odvozují, nikdo je nepíše ručně.

Každá definice je krátká a srozumitelná a odkazuje na zdroj, kde se dá číst dál: dokumentaci, specifikaci nebo encyklopedii. Pojmy jsou tří druhů: programovací jazyky, technologie a koncepty.

Mapa nahoře kreslí tytéž vazby jako síť: každý pojem je hvězda, větší podle počtu stránek, které ho jmenují, a vlákna vedou k pojmům, které se objevují na stejných stránkách. Takové mapě se říká graf souvýskytu; pojmy, které stojí uprostřed, drží web pohromadě."""
