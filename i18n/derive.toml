# The prose the generators write into derived pages (scripts/build-*.mjs, through t() of
# scripts/lib/derive.mjs). {name} is a value the generator passes; [[term-id]] or
# [[term-id|label]] becomes a link to that glossary term (checked by Zola); a key with __one,
# __few, __other is chosen by Intl.PluralRules for its {n}.

# Shared

[derive_and]
en = "and"
cs = "a"

[derive_months]
en = "January,February,March,April,May,June,July,August,September,October,November,December"
cs = "ledna,února,března,dubna,května,června,července,srpna,září,října,listopadu,prosince"

[derive_date]
en = "{day} {month} {year}"
cs = "{day}. {month} {year}"

