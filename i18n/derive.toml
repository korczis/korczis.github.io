[derive_work_list_article]
en = """

This page holds every original project, each with its own page. A project is recent by the date of its last [[commit|commit]] on the default branch, never by when its host last saw activity, and falls into one of the periods of {periods} months; a project whose last commit is older than {max} months is archive, dated by its first and last year, never hidden.

Every project has its own page with a derived article, measured facts, its source on each forge, related work and the concepts it builds on. [[fork|Forks]] and [[mirror|mirrors]] are left out: this is the owner's own work only."""
cs = """

Tato stránka drží každý vlastní projekt, každý s vlastní stránkou. Projekt je nedávný podle data svého posledního [[commit|commitu]] ve výchozí větvi, ne podle toho, kdy na hostingu naposledy něco proběhlo, a řadí se do jednoho z období {periods} měsíců; projekt, jehož poslední commit je starší než {max} měsíců, patří do archivu, datovaný prvním a posledním rokem, nikdy skrytý.

Každý projekt má vlastní stránku s odvozeným článkem, změřenými fakty, zdrojem na každém hostingu, související prací a pojmy, na kterých stojí. [[fork|Forky]] a [[mirror|mirrory]] tu nejsou: jde jen o vlastní práci."""

