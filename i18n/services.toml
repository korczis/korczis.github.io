[services_title]
en = "Services"
cs = "Služby"
[services_lead]
en = "Due diligence, M&A, digital investigation, forensics and reputation: the problem each service solves, its method, its skills and the evidence."
cs = "Due diligence, M&A, digitální vyšetřování, forenzní analýza a reputace: problém, který každá služba řeší, postup, dovednosti a doklady."
[services_og]
en = "Services: due diligence, M&A, investigation, forensics"
cs = "Služby: due diligence, M&A, vyšetřování, forenzní analýza"
[services_skills_title]
en = "Skills"
cs = "Dovednosti"
[services_skills_lead]
en = "Every skill my services draw on, defined, with the public work that shows it, the client use cases and the technologies behind it."
cs = "Každá dovednost, ze které moje služby čerpají, s definicí, veřejnou prací, která ji dokládá, případy užití z klientské práce a technologiemi za ní."
[skills_og]
en = "Skills behind the services, each with its evidence"
cs = "Dovednosti za službami, každá s doklady"

[derive_services_intro]
en = "I offer {n} services: {list}. Each page says what problem it solves, the principle it rests on, the method step by step and what you receive, then shows the skills it draws on, the technologies, the public work that proves them and use cases from client work."
cs = "Nabízím {n} služeb: {list}. Každá stránka říká, jaký problém řeší, na jakém principu stojí, jaký je postup krok za krokem a co dostanete, a pak ukazuje dovednosti, ze kterých čerpá, technologie, veřejnou práci, která je dokládá, a případy užití z klientské práce."
[derive_services_how]
en = "How this is built: the words of each service are mine; everything else is derived from measured data. The skills resolve to the same vocabulary as the [[osint|investigation]] and [[due-diligence|due diligence]] experience on the home page, the evidence comes from my public repositories and the client work is described without any name, date or number."
cs = "Jak to vzniká: slova každé služby jsou moje; vše ostatní je odvozené z měřených dat. Dovednosti vycházejí ze stejného slovníku jako zkušenosti s [[osint|vyšetřováním]] a [[due-diligence|due diligence]] na úvodní stránce, doklady pocházejí z mých veřejných repozitářů a klientská práce je popsaná bez jakéhokoli jména, data či čísla."
[derive_skills_intro]
en = "{n} skills carry my {services} services. Each has its own page: what it is, which services draw on it, the technologies it is practised with, the public work that shows it and the client use cases where it was applied."
cs = "{n} dovedností nese mých {services} služeb. Každá má vlastní stránku: co to je, které služby z ní čerpají, s jakými technologiemi se praktikuje, veřejná práce, která ji dokládá, a případy užití z klientské práce, kde byla použita."
[derive_skills_how]
en = "How this is built: a skill is a capability of the experience vocabulary, so the same keywords that infer it from my work also link it here; its public evidence and use cases are derived, never typed. The [[knowledge-graph|graph]] links skills to services and technologies."
cs = "Jak to vzniká: dovednost je schopnost ze slovníku zkušeností, takže stejná klíčová slova, která ji odvozují z mé práce, ji propojují i sem; její veřejné doklady a případy užití jsou odvozené, nikdy ručně psané. [[knowledge-graph|Graf]] propojuje dovednosti se službami a technologiemi."

