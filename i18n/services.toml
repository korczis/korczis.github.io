# The services and skills section (scripts/build-services.mjs, templates/services.html, service.html,
# skills.html, skill.html). Client work appears as use cases only: sector, role and what was solved,
# never a name, a date or a number (ADR 0006). Keys with __one, __few, __other are chosen for {n}.

