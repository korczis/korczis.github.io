en = "How to read this page: the method and the use cases are written by me; the skills, technologies and public evidence are derived from measured data and link to their own pages, each a [[repository|repository]], a term or a skill."
cs = "Jak číst tuto stránku: postup a případy užití píšu já; dovednosti, technologie a veřejné doklady jsou odvozené z měřených dat a vedou na vlastní stránky, každý [[repository|repozitář]], pojem nebo dovednost."

