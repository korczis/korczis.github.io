# The case studies (scripts/build-cases.mjs, templates/cases.html, case.html; ADR 0010): one page per
# client engagement with measurable sources, anonymised (ADR 0006). The sector and roles are the
# owner's declarations; the period and scale are measured and rounded; the capabilities are inferred
# and always labelled so. Figures come only through {placeholders}.

