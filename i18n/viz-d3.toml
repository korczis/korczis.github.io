# The D3 simulators (static/js/viz/stream.js, pack.js, spiral.js): their controls, tooltips and
# counts. A text with a count has its plural forms (key__one, key__few, key__other), which
# KorczisHub.t() picks by the language's rule; English has no "few" and repeats "other".

# --- shared ------------------------------------------------------------------------------------
